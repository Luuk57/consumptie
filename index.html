<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasker - Eten & Drinken</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            text-align: center;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .progress-container {
            background: #e0e0e0;
            border-radius: 8px;
            height: 25px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #2ecc71;
            text-align: center;
            color: white;
            font-weight: bold;
            line-height: 25px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        #statusMelding {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍎 Eten & Drinken (Google Sync)</h1>
    <div id="statusMelding" style="color: #27ae60;">Klaar om te synchroniseren</div>

    <!-- Vochtmonitor Sectie -->
    <div class="section">
        <h3>Vochtmonitor Vandaag</h3>
        <label for="dagLimiet">Dagelijks Vochtlimiet (ml):</label>
        <input type="number" id="dagLimiet" value="1000" onchange="slaLimietOp()">

        <label>Voortgang Vochtinename:</label>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar">0 ml</div>
        </div>

        <label for="vochtInvoer">Vocht toevoegen (ml):</label>
        <input type="number" id="vochtInvoer" placeholder="Bijv. 250">
        <button onclick="voegVochtToe()">Voeg toe & Synchroniseer</button>
        <button onclick="resetVocht()" style="background-color: #e74c3c;">Reset Vandaag</button>
    </div>

    <!-- Eten / Maaltijden Sectie -->
    <div class="section">
        <h3>Maaltijden & Dieet Notities</h3>
        <label for="maaltijdInput">Wat heb je gegeten?</label>
        <textarea id="maaltijdInput" rows="3" placeholder="Noteer je maaltijd..."></textarea>
        <button onclick="slaMaaltijdOp()">Maaltijd Opslaan & Synchroniseer</button>
    </div>
</div>

<script>
    // Jouw unieke Google Apps Script URL
    const scriptURL = "https://script.google.com/macros/s/AKfycbxjKWvAzZo-uNtbQtwSjV9MhwRMbxf8t6lyiNafbjgXuYKSjEVFSwZKZw-IHgL62eHw/exec";

    let totaalVocht = parseInt(localStorage.getItem('totaalVocht')) || 0;

    function init() {
        document.getElementById('dagLimiet').value = localStorage.getItem('dagLimiet') || 1000;
        updateVochtUI();
    }

    function slaLimietOp() {
        let limiet = parseInt(document.getElementById('dagLimiet').value) || 1000;
        localStorage.setItem('dagLimiet', limiet);
        updateVochtUI();
    }

    function voegVochtToe() {
        let invoer = parseInt(document.getElementById('vochtInvoer').value);
        if (isNaN(invoer) || invoer <= 0) {
            alert("Vul een geldig aantal milliliters in.");
            return;
        }

        totaalVocht += invoer;
        localStorage.setItem('totaalVocht', totaalVocht);
        updateVochtUI();
        
        // Data naar Google Spreadsheet sturen
        stuurNaarGoogle("Drinken", invoer, "Vochtinname");
        document.getElementById('vochtInvoer').value = '';
    }

    function slaMaaltijdOp() {
        let tekst = document.getElementById('maaltijdInput').value.trim();
        if (tekst === '') {
            alert("Vul eerst een maaltijd of notitie in.");
            return;
        }

        // Data naar Google Spreadsheet sturen
        stuurNaarGoogle("Eten", 0, tekst);
        document.getElementById('maaltijdInput').value = '';
    }

    function resetVocht() {
        totaalVocht = 0;
        localStorage.setItem('totaalVocht', totaalVocht);
        updateVochtUI();
        stuurNaarGoogle("Reset", 0, "Vocht gereset");
    }

    function updateVochtUI() {
        let limiet = parseInt(document.getElementById('dagLimiet').value) || 1000;
        let bar = document.getElementById('progressBar');
        let percentage = Math.min((totaalVocht / limiet) * 100, 100);

        bar.style.width = percentage + '%';
        bar.textContent = totaalVocht + ' ml / ' + limiet + ' ml';

        if (percentage >= 100) {
            bar.style.backgroundColor = '#e74c3c'; // Rood
        } else if (percentage >= 80) {
            bar.style.backgroundColor = '#e67e22'; // Oranje
        } else {
            bar.style.backgroundColor = '#2ecc71'; // Groen
        }
    }

    function stuurNaarGoogle(type, invoer, notitie) {
        let status = document.getElementById('statusMelding');
        status.textContent = "Bezig met synchroniseren naar Google...";
        status.style.color = "#e67e22";

        let datum = new Date().toLocaleString();

        let formData = new URLSearchParams();
        formData.append('datum', datum);
        formData.append('type', type);
        formData.append('invoer', invoer);
        formData.append('notitie', notitie);

        // Fetch verzoek naar de Google Spreadsheet script URL
        fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
            .then(() => {
                status.textContent = "✔ Succesvol gesynchroniseerd met Google Drive!";
                status.style.color = "#27ae60";
                setTimeout(() => { status.textContent = "Klaar om te synchroniseren"; }, 4000);
            })
            .catch(error => {
                status.textContent = "⚠ Fout bij synchroniseren.";
                status.style.color = "#e74c3c";
                console.error('Error!', error.message);
            });
    }

    window.onload = init;
</script>

</body>
</html>
