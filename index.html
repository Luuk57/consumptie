<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasker - Vocht Monitor & Eten/Drinken</title>
    <!-- Tailwind CSS voor modern design -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta name="theme-color" content="#0284c7">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-sky-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                💧 Tasker - Vocht Monitor
            </h1>
            <span class="text-xs bg-sky-800 px-2 py-1 rounded-full text-sky-200">Eten & Drinken Module</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow space-y-6 pb-20">

        <!-- Status / Meldingen -->
        <div id="statusMessage" class="hidden p-4 rounded-xl text-sm font-medium transition-all shadow-sm"></div>

        <!-- Drinken Totaal / Progressbar -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-slate-700 uppercase tracking-wide">Drinken Totaal Vandaag</span>
                <span id="totaalTekst" class="text-sm font-extrabold text-sky-700">0 / 1000 ml</span>
            </div>
            <!-- Progressbar -->
            <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
                <div id="progressBar" class="bg-sky-600 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </section>

        <!-- Modus / Tabs (Eten, Drinken, Vandaag, Overzicht, Config) -->
        <div class="grid grid-cols-5 gap-1 bg-slate-200 p-1.5 rounded-2xl text-xs font-bold text-center">
            <button onclick="switchTab('eten')" id="tab-eten" class="py-2.5 rounded-xl bg-white text-sky-700 shadow-sm transition">🍽️️ Eten</button>
            <button onclick="switchTab('dranken')" id="tab-dranken" class="py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition">🥤 Drinken</button>
            <button onclick="switchTab('vandaag')" id="tab-vandaag" class="py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition">📅 Vandaag</button>
            <button onclick="switchTab('overzicht')" id="tab-overzicht" class="py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition">📊 Overzicht</button>
            <button onclick="switchTab('config')" id="tab-config" class="py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition">⚙️ Config</button>
        </div>

        <!-- TAB 1: Eten Invoeren -->
        <div id="section-eten" class="tab-content bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2">🍽️ Eten Invoeren</h2>
            <div id="etenItemsContainer" class="space-y-3">
                <!-- Dynamische eten rijen -->
            </div>
            <button onclick="voegEtenRijToe()" class="text-xs bg-sky-50 text-sky-700 hover:bg-sky-100 font-bold px-3 py-2 rounded-xl transition">+ Item Toevoegen</button>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Bijzonderheden</label>
                <input type="text" id="etenNotitie" placeholder="Eventuele opmerkingen..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-base outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <button onclick="slaEtenOp()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition">Eten Opslaan</button>
        </div>

        <!-- TAB 2: Drinken Invoeren -->
        <div id="section-dranken" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2">🥤 Drinken Invoeren</h2>
            <div id="drankenItemsContainer" class="space-y-3">
                <!-- Dynamische dranken rijen -->
            </div>
            <button onclick="voegDrankRijToe()" class="text-xs bg-sky-50 text-sky-700 hover:bg-sky-100 font-bold px-3 py-2 rounded-xl transition">+ Drankje Toevoegen</button>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Bijzonderheden</label>
                <input type="text" id="drankNotitie" placeholder="Eventuele opmerkingen..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-base outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <button onclick="slaDrankenOp()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition">Drinken Opslaan</button>
        </div>

        <!-- TAB 3: Vandaag Overzicht -->
        <div id="section-vandaag" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2">📅 Dag Overzicht</h2>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Kies Datum</label>
                <input type="date" id="dagOverzichtDatum" onchange="laadDagOverzicht()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-base outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b text-slate-500 uppercase text-xs">
                            <th class="py-2 px-2">Datum/Tijd</th>
                            <th class="py-2 px-2">Type</th>
                            <th class="py-2 px-2">Item</th>
                            <th class="py-2 px-2">Hoeveelheid</th>
                            <th class="py-2 px-2 text-right">Actie</th>
                        </tr>
                    </thead>
                    <tbody id="dagOverzichtTbody">
                        <!-- Wordt dynamisch gevuld -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 4: Periode Overzicht & Exporteren -->
        <div id="section-overzicht" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2">📊 Periode Overzicht & Exporteren</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Startdatum</label>
                    <input type="date" id="exportStart" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-base outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Einddatum</label>
                    <input type="date" id="exportEind" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-base outline-none focus:ring-2 focus:ring-sky-500">
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="laadPeriodeOverzicht()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition text-sm">Overzicht Tonen</button>
                <button onclick="exporteerData('pdf')" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl transition text-sm">Exporteer PDF</button>
                <button onclick="exporteerData('excel')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-sm">Exporteer Excel</button>
            </div>
            <div class="overflow-x-auto pt-3">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b text-slate-500 uppercase text-xs">
                            <th class="py-2 px-2">Datum/Tijd</th>
                            <th class="py-2 px-2">Type</th>
                            <th class="py-2 px-2">Item</th>
                            <th class="py-2 px-2">Hoeveelheid</th>
                            <th class="py-2 px-2">Notitie</th>
                        </tr>
                    </thead>
                    <tbody id="totaalOverzichtTbody">
                        <!-- Wordt dynamisch gevuld -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 5: Configuratie -->
        <div id="section-config" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2">⚙️ Instellingen & Limieten</h2>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Dagelijkse Vochtlimiet (ml)</label>
                <input type="number" id="configLimiet" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-base outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <button onclick="slaConfigOp()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl transition">Instellingen Opslaan</button>
        </div>

    </main>

    <!-- JavaScript Logica -->
    <script>
        // Jouw nieuwe gekoppelde Google Web App URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxDfu_rRicy4pWBfFpim4Og71oduJv_G71kD4xoiAiVIo2jOxdzwKHwstbhmjhubAAi3Q/exec";

        let appConfig = {
            limiet: 1000,
            dranken: ['Koffie', 'Thee', 'Water', 'Soep', 'Melk'],
            hoeveelheden: [50, 100, 150, 200, 250, 300],
            eten: ['Brood', 'Fruit', 'Yoghurt', 'Koek', 'Warme Maaltijd'],
            eenheden: ['Portie', 'Plak', 'Stuk', 'Kom', 'Bord']
        };

        window.onload = function() {
            const vandaag = new Date().toISOString().split('T')[0];
            document.getElementById('dagOverzichtDatum').value = vandaag;
            document.getElementById('exportStart').value = vandaag;
            document.getElementById('exportEind').value = vandaag;

            laadConfig();
            voegEtenRijToe();
            voegDrankRijToe();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('section-' + tabId).classList.remove('hidden');

            document.querySelectorAll('.grid.grid-cols-5 button').forEach(btn => {
                btn.className = "py-2.5 rounded-xl text-slate-600 hover:text-slate-900 transition";
            });
            document.getElementById('tab-' + tabId).className = "py-2.5 rounded-xl bg-white text-sky-700 shadow-sm transition";

            if (tabId === 'vandaag') laadDagOverzicht();
        }

        function toonStatus(bericht, isFout = false) {
            const el = document.getElementById('statusMessage');
            el.innerText = bericht;
            el.className = `p-4 rounded-xl text-sm font-medium transition-all shadow-sm ${isFout ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        // Configuratie inladen
        function laadConfig() {
            fetch(`${WEB_APP_URL}?actie=getConfig`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.limiet) {
                        appConfig = data;
                        document.getElementById('configLimiet').value = appConfig.limiet;
                    }
                    laadDagOverzicht();
                })
                .catch(err => console.warn("Fout bij laden config:", err));
        }

        // Eten rij toevoegen
        function voegEtenRijToe() {
            const container = document.getElementById('etenItemsContainer');
            const rowId = 'eten_' + Date.now() + Math.random();
            const optsEten = appConfig.eten.map(e => `<option value="${e}">${e}</option>`).join('');
            const optsEenheid = appConfig.eenheden.map(en => `<option value="${en}">${en}</option>`).join('');

            const html = `
                <div id="${rowId}" class="flex flex-col sm:flex-row gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <select class="eten-produkt w-full sm:flex-1 bg-white border border-slate-200 rounded-lg p-2 text-sm">${optsEten}</select>
                    <select class="eten-hoeveelheid w-full sm:w-36 bg-white border border-slate-200 rounded-lg p-2 text-sm">${optsEenheid}</select>
                    <button onclick="document.getElementById('${rowId}').remove()" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1">Verwijder</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        // Drinken rij toevoegen
        function voegDrankRijToe() {
            const container = document.getElementById('drankenItemsContainer');
            const rowId = 'drank_' + Date.now() + Math.random();
            const optsDrank = appConfig.dranken.map(d => `<option value="${d}">${d}</option>`).join('');
            const optsMl = appConfig.hoeveelheden.map(ml => `<option value="${ml}">${ml} ml</option>`).join('');

            const html = `
                <div id="${rowId}" class="flex flex-col sm:flex-row gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <select class="drank-type w-full sm:flex-1 bg-white border border-slate-200 rounded-lg p-2 text-sm">${optsDrank}</select>
                    <select class="drank-ml w-full sm:w-36 bg-white border border-slate-200 rounded-lg p-2 text-sm">${optsMl}</select>
                    <button onclick="document.getElementById('${rowId}').remove()" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1">Verwijder</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        // Opslaan Eten
        function slaEtenOp() {
            const items = [];
            document.querySelectorAll('#etenItemsContainer > div').forEach(row => {
                items.push({
                    produkt: row.querySelector('.eten-produkt').value,
                    hoeveelheid: row.querySelector('.eten-hoeveelheid').value
                });
            });

            if (items.length === 0) return toonStatus("Voeg minimaal één eten item toe.", true);

            const payload = {
                actie: 'slaInnameOp',
                type: 'eten',
                items: items,
                notitie: document.getElementById('etenNotitie').value
            };

            fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    toonStatus(res.message);
                    document.getElementById('etenNotitie').value = '';
                    document.getElementById('etenItemsContainer').innerHTML = '';
                    voegEtenRijToe();
                    laadDagOverzicht();
                })
                .catch(err => toonStatus("Fout bij opslaan: " + err, true));
        }

        // Opslaan Drinken
        function slaDrankenOp() {
            const items = [];
            document.querySelectorAll('#drankenItemsContainer > div').forEach(row => {
                items.push({
                    drank: row.querySelector('.drank-type').value,
                    hoeveelheid: row.querySelector('.drank-ml').value
                });
            });

            if (items.length === 0) return toonStatus("Voeg minimaal één drankje toe.", true);

            const payload = {
                actie: 'slaInnameOp',
                type: 'dranken',
                items: items,
                notitie: document.getElementById('drankNotitie').value
            };

            fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    toonStatus(res.message);
                    document.getElementById('drankNotitie').value = '';
                    document.getElementById('drankenItemsContainer').innerHTML = '';
                    voegDrankRijToe();
                    laadDagOverzicht();
                })
                .catch(err => toonStatus("Fout bij opslaan: " + err, true));
        }

        // Dagoverzicht inladen & progressbar bijwerken
        function laadDagOverzicht() {
            const datum = document.getElementById('dagOverzichtDatum').value;
            fetch(`${WEB_APP_URL}?actie=getDagOverzicht&datum=${datum}`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('dagOverzichtTbody');
                    tbody.innerHTML = '';

                    if (!data.items || data.items.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-slate-400">Geen registraties gevonden voor deze dag</td></tr>`;
                    } else {
                        data.items.forEach(i => {
                            tbody.innerHTML += `
                                <tr class="border-b">
                                    <td class="py-2 px-2 text-xs text-slate-600">${i.datum}</td>
                                    <td class="py-2 px-2 font-semibold">${i.type}</td>
                                    <td class="py-2 px-2">${i.item}</td>
                                    <td class="py-2 px-2">${i.hoeveelheid || '-'}</td>
                                    <td class="py-2 px-2 text-right"><button onclick="verwijderItem('${i.id}')" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold">Verwijder</button></td>
                                </tr>
                            `;
                        });
                    }

                    // Progressbar bijwerken
                    const totaalMl = data.totaalMl || 0;
                    const limiet = appConfig.limiet || 1000;
                    document.getElementById('totaalTekst').innerText = `${totaalMl} / ${limiet} ml`;
                    let percentage = (totaalMl / limiet) * 100;
                    if (percentage > 100) percentage = 100;
                    document.getElementById('progressBar').style.width = percentage + '%';
                })
                .catch(err => console.warn("Fout bij ophalen dagoverzicht:", err));
        }

        // Item verwijderen
        function verwijderItem(id) {
            if (!confirm("Weet je zeker dat je dit item wilt verwijderen?")) return;
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ actie: 'verwijderItem', id: id })
            })
            .then(res => res.json())
            .then(res => {
                toonStatus(res.message);
                laadDagOverzicht();
            })
            .catch(err => toonStatus("Fout bij verwijderen", true));
        }

        // Periode overzicht inladen
        function laadPeriodeOverzicht() {
            const start = document.getElementById('exportStart').value;
            const eind = document.getElementById('exportEind').value;

            fetch(`${WEB_APP_URL}?actie=getTotaalOverzicht&start=${start}&eind=${eind}`)
                .then(res => res.json())
                .then(items => {
                    const tbody = document.getElementById('totaalOverzichtTbody');
                    tbody.innerHTML = '';

                    if (!items || items.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-slate-400">Geen data in deze periode</td></tr>`;
                    } else {
                        items.forEach(i => {
                            tbody.innerHTML += `
                                <tr class="border-b">
                                    <td class="py-2 px-2 text-xs">${i.datum}</td>
                                    <td class="py-2 px-2 font-semibold">${i.type}</td>
                                    <td class="py-2 px-2">${i.item}</td>
                                    <td class="py-2 px-2">${i.hoeveelheid || '-'}</td>
                                    <td class="py-2 px-2 text-xs text-slate-500">${i.notitie || ''}</td>
                                </tr>
                            `;
                        });
                    }
                });
        }

        // Exporteren naar PDF of Excel
        function exporteerData(formaat) {
            const start = document.getElementById('exportStart').value;
            const eind = document.getElementById('exportEind').value;

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ actie: 'exporteerEtenDrinken', start: start, eind: eind, formaat: formaat })
            })
            .then(res => res.json())
            .then(res => toonStatus(res.message))
            .catch(err => toonStatus("Export fout: " + err, true));
        }

        // Configuratie opslaan
        function slaConfigOp() {
            const nieuweLimiet = parseInt(document.getElementById('configLimiet').value) || 1000;
            appConfig.limiet = nieuweLimiet;

            const payload = {
                actie: 'updateConfig',
                limiet: nieuweLimiet,
                dranken: appConfig.dranken,
                hoeveelheden: appConfig.hoeveelheden,
                eten: appConfig.eten,
                eenheden: appConfig.eenheden
            };

            fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(res => {
                    toonStatus(res.message);
                    laadDagOverzicht();
                })
                .catch(err => toonStatus("Fout bij opslaan config", true));
        }
    </script>
</body>
</html>
